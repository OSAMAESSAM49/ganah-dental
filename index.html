<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>عيادة جنة</title>
  <meta name="description" content="نظام إدارة عيادة جنة لطب الفم والأسنان">
  <meta name="theme-color" content="#4A0CD3">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="عيادة جنة">
  <!-- Apply the saved theme before first paint (no flash). -->
  <script>
    try {
      var t = (JSON.parse(localStorage.getItem('ganah.prefs') || '{}') || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/widgets.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/patients.css">
  <link rel="stylesheet" href="./css/chart.css">
  <link rel="stylesheet" href="./css/appointments.css">
  <link rel="stylesheet" href="./css/print.css">
  <link rel="modulepreload" href="./js/app.js">
</head>
<body>
  <button type="button" class="skip-link" data-skip-link>تخطي إلى المحتوى</button>

  <div id="app" class="app"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="print-root"></div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <svg class="brand-mark" viewBox="0 0 100 100"><rect width="100" height="100" rx="26" fill="#4A0CD3"/><path d="M24 33v5a26 26 0 0 0 52 0v-5" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>
      <span>جارٍ التحميل…</span>
    </div>
  </div>

  <noscript>
    <p style="padding: 2rem; font-family: sans-serif">يحتاج هذا البرنامج إلى تفعيل JavaScript في المتصفح.</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
